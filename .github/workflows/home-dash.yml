name: Build and deploy home dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by several minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["home-dash/**", ".github/workflows/home-dash.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_data.py
        working-directory: home-dash
      - name: Cache-bust CSS and JS so tablets pick up updates
        run: sed -i "s#app.js#app.js?v=${GITHUB_RUN_ID}#; s#style.css#style.css?v=${GITHUB_RUN_ID}#" home-dash/site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: home-dash/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
