<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<link rel="stylesheet" href="style.css">
</head><body class="wx">
<div class="wrap">
  <div class="wxhead">
    <div class="wxplace">Costa Mesa, CA</div>
    <div class="wxwhen"><span id="clock"></span><span id="date"></span></div>
  </div>
  <div class="wxmain">
    <div class="wxhero" id="wxhero"></div>
    <div class="wxtiles" id="wxtiles"></div>
  </div>
  <div class="wxhourly" id="wxhourly"></div>
  <div class="fc" id="forecast"></div>
  <div id="updated"></div>
</div>
<script src="app.js"></script>
</body></html>
